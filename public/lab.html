<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mimic Voice Test Lab</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body { overflow: auto; height: auto; min-height: 100%; }
    body { background: radial-gradient(circle at 30% 0%, #3d1f3a, #120a12 70%) fixed; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 20px 60px; }
    .top { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; }
    .top h1 { font-size: 56px; }
    .top nav { margin-left: auto; display: flex; gap: 16px; }
    .top a { color: var(--muted); font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; align-items: start; }
    h2 { font-family: 'Lilita One'; font-weight: 400; font-size: 30px; margin: 0 0 10px; }
    h3 { font-family: 'Lilita One'; font-weight: 400; font-size: 20px; margin: 14px 0 8px; color: var(--yellow); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, input[type=text], input[type=number] { font: inherit; font-weight: 600; background: rgba(0,0,0,.4); color: #fff; border: 2px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px 10px; }
    input[type=number] { width: 70px; }
    .muted { color: var(--muted); font-size: 14px; }
    .room { background: rgba(255,255,255,.04); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; border: 2px solid rgba(255,255,255,.06); }
    .room-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .room-head .code { font-family: 'Lilita One'; font-size: 28px; color: var(--yellow); letter-spacing: 3px; }
    .phase { background: var(--pink); color: #fff; font-weight: 700; font-size: 13px; padding: 3px 10px; border-radius: 10px; text-transform: uppercase; }
    .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; margin: 10px 0; }
    .pl { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.3); border-radius: 10px; padding: 6px 8px; font-weight: 600; font-size: 14px; }
    .pl b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pl .sc { color: var(--yellow); font-family: 'Lilita One'; font-weight: 400; }
    .pl button { border: 0; background: none; color: #ff7a7a; font-size: 16px; padding: 0 2px; }
    .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
    .log { height: 220px; overflow: auto; background: rgba(0,0,0,.45); border-radius: 12px; padding: 8px 10px; font: 12px/1.5 ui-monospace, Consolas, monospace; color: #cfe; }
    .log div { white-space: pre-wrap; }
    .play .wave-wrap { width: 100%; height: 150px; }
    .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .stat { background: rgba(0,0,0,.35); border-radius: 12px; padding: 8px; text-align: center; }
    .stat b { display: block; font-family: 'Lilita One'; font-weight: 400; font-size: 30px; color: #fff; }
    .stat span { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .stat.big b { font-size: 44px; color: var(--yellow); }
    .va { margin-top: 8px; font-size: 14px; color: #dcc; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
    td, th { padding: 5px 6px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.07); }
    th { color: var(--muted); font-weight: 600; }
    .login { max-width: 420px; margin: 12vh auto; text-align: center; }
    .login input { width: 100%; margin: 10px 0; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,.1); font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <div id="toast"></div>
  <script type="module" src="js/lab.js"></script>
</body>
</html>
